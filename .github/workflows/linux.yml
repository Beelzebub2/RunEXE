name: Linux portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} CLI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q

  libc:
    name: ${{ matrix.name }} CLI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian (glibc)
            image: python:3.13-slim
          - name: Alpine (musl)
            image: python:3.13-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Run tests in ${{ matrix.name }}
        run: >-
          docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} sh -lc
          "python -m pip install -q -e '.[dev]' &&
          python -m pytest -q &&
          python -m ruff check . &&
          runexe version"

  qt:
    name: Debian Qt/offscreen GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run GUI tests and startup smoke test
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.13-slim sh -lc '
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              libegl1 libgl1 libx11-6 libx11-xcb1 libdbus-1-3 \
              libfontconfig1 libfreetype6 libglib2.0-0 \
              libwayland-client0 libwayland-cursor0 libwayland-egl1 \
              libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
              libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
              libxcb-xfixes0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0
            python -m pip install -q -e ".[dev,gui]"
            python -m pytest -q
            if QT_QPA_PLATFORM=offscreen timeout 3s runexe-gui --platform offscreen \
              >/tmp/runexe-gui.log 2>&1; then
              exit 1
            else
              test $? -eq 124
            fi
          '
