[project]
name = "runexe"
version = "0.1.1"
description = "Automatically analyze and run Windows executables on Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12"
]

[project.scripts]
runexe = "runexe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"